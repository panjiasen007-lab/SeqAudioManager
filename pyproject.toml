[project]
name = "seqaudio-manager"
version = "0.1.0"
description = "音序管家 — 本地音乐元数据批量处理工具"
requires-python = ">=3.10"
dependencies = [
    "mutagen>=1.47.0",
    "PySide6>=6.7.0",
    "httpx[http2]>=0.27.0",
    "platformdirs>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
