[project]
name = "seqaudio-manager"
version = "1.0.0"
description = "音序管家 — 本地音乐元数据批量处理与真假无损鉴定"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "SeqAudio Manager Contributors" }]
keywords = ["music", "metadata", "flac", "dsd", "lossless", "tagging"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "mutagen>=1.47.0",
    "PySide6>=6.7.0",
    "numpy>=1.26",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0", "py7zr>=0.21", "pillow>=10", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
